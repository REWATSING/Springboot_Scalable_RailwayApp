version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app                   # Bind mount for live Angular code changes
      - /app/node_modules                 # Prevent container node_modules from being overwritten
    networks:
      - app-net
    container_name: ticketxpress-frontend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app                    # Bind mount for live Spring Boot changes (if hot reload setup)
      - ./backend/target:/app/target      # Optional: mount JAR build output if needed
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/ticketxpress_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db
    networks:
      - app-net
    container_name: ticketxpress-backend
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: mysql-db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ticketxpress_db
    volumes:
      - db_data:/var/lib/mysql              # Named volume for persistent storage
      - ./database:/docker-entrypoint-initdb.d  # Init scripts (SQL dump etc.)
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
